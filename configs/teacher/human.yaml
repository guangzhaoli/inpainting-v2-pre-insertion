# Teacher baseline: human category, LoRA r128. reference_cfg off.

trainer: QwenImageEditInsertAnything

model:
  pretrained_model_name_or_path: "/inspire/hdd/global_user/250041225002/project/model/qwen-image-edit-2511"
  quantize: false
  reference_cfg:
    enabled: false
    train_dropout_rate: 0.0
    force_empty_prompt: false
    mask_aware: false
    delta_clip_enabled: false
    delta_clip_max_ratio: 0.5
  lora:
    r: 128
    lora_alpha: 128
    target_modules: ["to_q", "to_k", "to_v", "to_out.0", "add_q_proj", "add_k_proj", "add_v_proj", "to_add_out", "img_mlp.net.0.proj", "img_mlp.net.2", "txt_mlp.net.0.proj", "txt_mlp.net.2"]
    init_lora_weights: "gaussian"
    adapter_name: "teacher_human_lora"
    pretrained_weight: null

data:
  class_path: "src.data.insert_anything_dataset.InsertAnythingDataset"
  init_args:
    dataset_path: "/inspire/hdd/global_user/250041225002/project/qwen-inpainting/a2edit/data"
    manifest_path: "/inspire/hdd/global_user/250041225002/project/qwen-inpainting/inpainting-v2-pre-insertion/manifests/insert_anything_teacher_human.csv"
    categories:
      - "person"
      - "person_hair"
    require_prompt: false
    processor:
      class_path: "src.data.preprocess.ImageProcessor"
      init_args:
        process_type: "fixed_pixels"
        target_pixels: 1048576
        controls_pixels: [1048576, 1048576]
        resize_mode: "bilinear"

  batch_size: 1
  num_workers: 8
  shuffle: true
  drop_last: true

logging:
  output_dir: "logs/inpainting_v2_teacher_logs"
  tracker_project_name: "teacher_human"
  report_to: "tensorboard"

optimizer:
  class_path: "torch.optim.AdamW"
  init_args:
    lr: 1.0e-4
    betas: [0.9, 0.999]
    weight_decay: 0.01
    eps: 1.0e-8

lr_scheduler:
  scheduler_type: "cosine"
  warmup_steps: 500

train:
  gradient_accumulation_steps: 1
  max_train_steps: 100000000000
  num_epochs: 5
  checkpointing_steps: 1000
  checkpoints_total_limit: 20
  max_grad_norm: 1.0
  mixed_precision: "bf16"
  gradient_checkpointing: true

loss:
  mask_loss: true
  forground_weight: 2.0
  background_weight: 1.0

predict:
  devices:
    vae: "cuda:0"
    text_encoder: "cuda:0"
    dit: "cuda:0"

resume: null
