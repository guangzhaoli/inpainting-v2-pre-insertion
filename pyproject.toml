[project]
name = "insertfuse"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.9.1",
  "torchvision==0.24.1",
  "diffusers==0.36.0",
  "transformers==4.55.4",
  "peft==0.17.1",
  "accelerate==1.10.1",
  "numpy==2.5.3",
  "pillow>=10.4,<13",
  "opencv-python==4.11.0.86",
  "pydantic==2.11.10",
  "pyyaml>=6,<7",
  "omegaconf==2.3.0",
  "pandas==2.3.3",
  "datasets==3.3.2",
  "pyarrow==26.0.0",
  "tensorboard==2.20.0",
  "safetensors>=0.6,<1",
  "lpips==0.1.4",
  "einops>=0.8,<1",
  "tabulate>=0.9,<1",
  "psutil>=6,<8",
  "blake3>=1,<2",
  "matplotlib>=3.10,<4",
  "rich>=13,<15",
  "imagehash>=4.3,<5",
  "flash-attn==2.8.3",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.15,<0.16"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
flash-attn = { path = "../pretrained_weights/wheels/flash_attn-2.8.3-cp312-cp312-linux_x86_64.whl" }

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203","W503"]  # common with Black

[tool.black]
line-length = 120
